name: Installer tests

on:
  push:
    paths:
      - '.github/workflows/tests.yml'
      - 'install.py'
      - 'requirements.txt'
      - 'templates/**'
      - 'tests/**'
  pull_request:
    paths:
      - '.github/workflows/tests.yml'
      - 'install.py'
      - 'requirements.txt'
      - 'templates/**'
      - 'tests/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python: '3.11'
          - os: macos-latest
            python: '3.14'
          - os: windows-latest
            python: '3.14'
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -r requirements.txt
      - run: python -m unittest discover -s tests -v
